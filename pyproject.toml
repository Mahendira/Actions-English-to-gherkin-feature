[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "english-to-gherkin"
version = "1.0.0"
description = "Provider-neutral conversion of English software requirements into validated Gherkin feature files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
english-to-gherkin = "english_to_gherkin.cli:main"
consolidate-gherkin = "english_to_gherkin.consolidate_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/english_to_gherkin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
