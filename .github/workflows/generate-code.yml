name: Generate application code

on:
  workflow_dispatch:
    inputs:
      feature_file:
        description: Final feature file in the target repository
        required: true
        default: features/search-api.feature
        type: string
      stack:
        description: Application family and build/test tool
        required: true
        default: java-maven
        type: choice
        options: [java-maven, java-gradle, python-pytest]
      output_repo:
        description: Optional owner/repo; blank means this repository
        required: false
        type: string
      base_branch:
        description: Optional source branch; blank uses repository default
        required: false
        type: string
      candidate_model_1:
        description: Candidate 1 as provider:model
        required: true
        default: openai:gpt-4o-mini
        type: string
      candidate_model_2:
        description: Optional candidate 2 as provider:model; leave blank to skip
        required: false
        default: ""
        type: string
      candidate_model_3:
        description: Optional candidate 3 as provider:model; leave blank to skip
        required: false
        default: ""
        type: string
      reviewer_model:
        description: Optional reviewer; blank uses first successful candidate
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONTROLLER_REPO: ${{ github.repository }}
      TARGET_INPUT: ${{ inputs.output_repo }}
    steps:
      - name: Check out generator
        uses: actions/checkout@v4
        with:
          path: generator

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: generator/pyproject.toml

      - name: Set up Java
        if: startsWith(inputs.stack, 'java-')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install generator
        run: pip install ./generator

      - name: Resolve target repository
        id: target
        shell: bash
        run: |
          set -euo pipefail
          raw="${TARGET_INPUT//[[:space:]]/}"
          if [[ -z "$raw" ]]; then repo="$CONTROLLER_REPO"; else
            raw="${raw#https://github.com/}"; raw="${raw#git@github.com:}"; repo="${raw%.git}"
          fi
          if [[ ! "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then exit 1; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "owner=${repo%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${repo#*/}" >> "$GITHUB_OUTPUT"

      - name: Create target GitHub App token
        id: app-token
        if: steps.target.outputs.repo != github.repository
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}

      - name: Clone target repository
        id: clone
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TARGET_REPO: ${{ steps.target.outputs.repo }}
          REQUESTED_BRANCH: ${{ inputs.base_branch }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          CONTROLLER_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$REQUESTED_BRANCH"
          if [[ -z "$branch" && "$TARGET_REPO" == "$CONTROLLER_REPO" ]]; then
            branch="$WORKFLOW_BRANCH"
          fi
          if [[ -z "$branch" ]]; then
            branch="$(gh repo view "$TARGET_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          fi
          echo "Cloning $TARGET_REPO branch: $branch"
          gh repo clone "$TARGET_REPO" target -- --depth 1 --branch "$branch"
          echo "base_branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Generate, test, and repair application code
        id: code
        working-directory: target
        timeout-minutes: 50
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CANDIDATE_MODEL_1: ${{ inputs.candidate_model_1 }}
          CANDIDATE_MODEL_2: ${{ inputs.candidate_model_2 }}
          CANDIDATE_MODEL_3: ${{ inputs.candidate_model_3 }}
          REVIEWER_MODEL_SPEC: ${{ inputs.reviewer_model }}
          LLM_TIMEOUT_SECONDS: "60"
        shell: bash
        run: |
          set -uo pipefail
          repo_root="$(pwd -P)"
          feature_path="$(realpath -m -- "${{ inputs.feature_file }}")"
          feedback_file="$RUNNER_TEMP/code-test-feedback.txt"
          if [[ "$feature_path" != "$repo_root/"* || ! -f "$feature_path" ]]; then
            echo "Feature file must exist inside the target repository." >&2
            exit 1
          fi

          run_tests() {
            case "${{ inputs.stack }}" in
              java-maven) mvn -B test ;;
              java-gradle)
                runner=gradle
                if [[ -x ./gradlew ]]; then runner=./gradlew; fi
                "$runner" test
                ;;
              python-pytest)
                python -m pip install -q pytest pytest-bdd
                if [[ -f pyproject.toml ]]; then python -m pip install -q -e . || true; fi
                if [[ -f requirements.txt ]]; then python -m pip install -q -r requirements.txt; fi
                if find tests -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
                  pytest
                else
                  python -m compileall -q .
                fi
                ;;
            esac
          }

          passed=false
          for attempt in 1 2 3; do
            echo "Code generation/repair attempt $attempt of 3"
            args=(
              --feature-file "$feature_path"
              --artifact-type application-code
              --stack "${{ inputs.stack }}"
              --repo-root "$repo_root"
              --max-attempts 3
            )
            if [[ -s "$feedback_file" ]]; then args+=(--feedback-file "$feedback_file"); fi
            if ! generate-project-artifact "${args[@]}"; then
              echo "Artifact generation failed on attempt $attempt" > "$feedback_file"
              continue
            fi
            if run_tests > "$feedback_file" 2>&1; then
              cat "$feedback_file"
              passed=true
              break
            fi
            cat "$feedback_file"
          done
          echo "tests_passed=$passed" >> "$GITHUB_OUTPUT"

      - name: Commit generated code
        id: commit
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "No code changes were generated." >&2
            exit 1
          fi
          branch="ai/${GITHUB_RUN_ID}-generate-application-code-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate application code from ${{ inputs.feature_file }}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push branch and create pull request
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TESTS_PASSED: ${{ steps.code.outputs.tests_passed }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --set-upstream origin "${{ steps.commit.outputs.branch }}"
          if [[ "$TESTS_PASSED" == true ]]; then
            title="Generate application code (${{ inputs.stack }})"
            status="Tests passed after no more than three generation/repair attempts."
          else
            title="[TESTS FAILING] Generate application code (${{ inputs.stack }})"
            status="Tests still fail after three generation/repair attempts; human review is required."
          fi
          gh pr create \
            --repo "${{ steps.target.outputs.repo }}" \
            --base "${{ steps.clone.outputs.base_branch }}" \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "$title" \
            --body "Generated from `${{ inputs.feature_file }}` using three candidates and an independent reviewer. $status"

      - name: Report unsuccessful repair
        if: steps.code.outputs.tests_passed != 'true'
        run: |
          echo "A review PR was created, but tests still fail after three attempts." >&2
          exit 1
