name: Generate Gherkin feature

on:
  workflow_dispatch:
    inputs:
      requirement_name:
        description: Short name used for the feature filename
        required: true
        type: string
      requirement_text:
        description: English software requirement
        required: true
        type: string
      output_repo:
        description: Optional owner/repo or GitHub URL; blank means this repository
        required: false
        type: string
      output_directory:
        description: Directory in the target repository
        required: true
        default: features
        type: string
      base_branch:
        description: Target branch for the pull request; blank uses repository default
        required: false
        type: string
      overwrite:
        description: Replace the feature when it already exists
        required: true
        default: false
        type: boolean
      create_pull_request:
        description: Create a branch and pull request instead of pushing to base branch
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-feature-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CONTROLLER_REPO: ${{ github.repository }}
      TARGET_INPUT: ${{ inputs.output_repo }}
    steps:
      - name: Check out generator
        uses: actions/checkout@v4
        with:
          path: generator

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: generator/pyproject.toml

      - name: Install generator
        run: pip install ./generator

      - name: Resolve and validate target repository
        id: target
        shell: bash
        run: |
          set -euo pipefail
          raw="${TARGET_INPUT//[[:space:]]/}"
          if [[ -z "$raw" ]]; then
            repo="$CONTROLLER_REPO"
          else
            raw="${raw#https://github.com/}"
            raw="${raw#git@github.com:}"
            repo="${raw%.git}"
          fi
          if [[ ! "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid target repository. Use owner/repo or a GitHub URL." >&2
            exit 1
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Validate authentication configuration
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          TARGET_REPO: ${{ steps.target.outputs.repo }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_REPO" != "$CONTROLLER_REPO" && -z "$CROSS_REPO_TOKEN" ]]; then
            echo "CROSS_REPO_TOKEN is required when output_repo is a different repository." >&2
            exit 1
          fi

      - name: Resolve base branch and clone target
        id: clone
        env:
          GH_TOKEN: ${{ steps.target.outputs.repo == github.repository && github.token || secrets.CROSS_REPO_TOKEN }}
          TARGET_REPO: ${{ steps.target.outputs.repo }}
          REQUESTED_BRANCH: ${{ inputs.base_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo view "$TARGET_REPO" >/dev/null
          branch="$REQUESTED_BRANCH"
          if [[ -z "$branch" ]]; then
            branch="$(gh repo view "$TARGET_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          fi
          gh repo clone "$TARGET_REPO" target -- --depth 1 --branch "$branch"
          echo "base_branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Generate and validate feature
        working-directory: target
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai_compatible' }}
          LLM_API_URL: ${{ vars.LLM_API_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --requirement-name "${{ inputs.requirement_name }}"
            --requirement-text "${{ inputs.requirement_text }}"
            --output-dir "${{ inputs.output_directory }}"
          )
          if [[ "${{ inputs.overwrite }}" == "true" ]]; then
            args+=(--overwrite)
          fi
          english-to-gherkin "${args[@]}"

      - name: Commit generated file
        id: commit
        working-directory: target
        env:
          CREATE_PR: ${{ inputs.create_pull_request }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "No changes were generated."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$CREATE_PR" == "true" ]]; then
            branch="ai-feature/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$branch"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi
          git add -- "${{ inputs.output_directory }}"
          git commit -m "Generate feature: ${{ inputs.requirement_name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push generated change
        if: steps.commit.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.target.outputs.repo == github.repository && github.token || secrets.CROSS_REPO_TOKEN }}
          CREATE_PR: ${{ inputs.create_pull_request }}
          GENERATED_BRANCH: ${{ steps.commit.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          if [[ "$CREATE_PR" == "true" ]]; then
            git push --set-upstream origin "$GENERATED_BRANCH"
          else
            git push origin "HEAD:${{ steps.clone.outputs.base_branch }}"
          fi

      - name: Create pull request
        if: steps.commit.outputs.changed == 'true' && inputs.create_pull_request
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.target.outputs.repo == github.repository && github.token || secrets.CROSS_REPO_TOKEN }}
        shell: bash
        run: |
          gh pr create \
            --repo "${{ steps.target.outputs.repo }}" \
            --base "${{ steps.clone.outputs.base_branch }}" \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "Generate feature: ${{ inputs.requirement_name }}" \
            --body "Generated from an English requirement by workflow run $GITHUB_RUN_ID. Review the scenarios before merging."
