name: Generate Gherkin feature

on:
  workflow_dispatch:
    inputs:
      requirement_file:
        description: Path to a UTF-8 requirement text file in the target repository
        required: true
        default: search-api.txt
        type: string
      output_repo:
        description: Optional owner/repo or GitHub URL; blank means this repository
        required: false
        type: string
      output_directory:
        description: Directory in the target repository
        required: true
        default: features
        type: string
      base_branch:
        description: Target branch for the pull request; blank uses repository default
        required: false
        type: string
      overwrite:
        description: Replace the feature when it already exists
        required: true
        default: false
        type: boolean
      create_pull_request:
        description: Create a branch and pull request instead of pushing to base branch
        required: true
        default: true
        type: boolean
      candidate_model_1:
        description: Candidate 1 as provider:model
        required: true
        default: openai:gpt-4o-mini
        type: string
      candidate_model_2:
        description: Candidate 2 as provider:model
        required: true
        default: gemini:gemini-3.5-flash-lite
        type: string
      candidate_model_3:
        description: Candidate 3 as provider:model
        required: true
        default: openrouter:openrouter/free
        type: string
      reviewer_model:
        description: Reviewer as provider:model
        required: true
        default: openai:gpt-4o-mini
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-feature-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CONTROLLER_REPO: ${{ github.repository }}
      TARGET_INPUT: ${{ inputs.output_repo }}
    steps:
      - name: Check out generator
        uses: actions/checkout@v4
        with:
          path: generator

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: generator/pyproject.toml

      - name: Install generator
        run: pip install ./generator

      - name: Resolve and validate target repository
        id: target
        shell: bash
        run: |
          set -euo pipefail
          raw="${TARGET_INPUT//[[:space:]]/}"
          if [[ -z "$raw" ]]; then
            repo="$CONTROLLER_REPO"
          else
            raw="${raw#https://github.com/}"
            raw="${raw#git@github.com:}"
            repo="${raw%.git}"
          fi
          if [[ ! "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid target repository. Use owner/repo or a GitHub URL." >&2
            exit 1
          fi
          owner="${repo%%/*}"
          name="${repo#*/}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create target-repository GitHub App token
        id: app-token
        if: steps.target.outputs.repo != github.repository
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}

      - name: Resolve base branch and clone target
        id: clone
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TARGET_REPO: ${{ steps.target.outputs.repo }}
          REQUESTED_BRANCH: ${{ inputs.base_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo view "$TARGET_REPO" >/dev/null
          branch="$REQUESTED_BRANCH"
          if [[ -z "$branch" ]]; then
            branch="$(gh repo view "$TARGET_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          fi
          gh repo clone "$TARGET_REPO" target -- --depth 1 --branch "$branch"
          echo "base_branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Generate and validate three feature candidates
        working-directory: target
        env:
          REQUIREMENT_FILE: ${{ inputs.requirement_file }}
          OUTPUT_DIRECTORY: ${{ inputs.output_directory }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CANDIDATE_MODEL_1: ${{ inputs.candidate_model_1 }}
          CANDIDATE_MODEL_2: ${{ inputs.candidate_model_2 }}
          CANDIDATE_MODEL_3: ${{ inputs.candidate_model_3 }}
          REVIEWER_MODEL_SPEC: ${{ inputs.reviewer_model }}
          LLM_TIMEOUT_SECONDS: "60"
        shell: bash
        run: |
          set -euo pipefail

          repo_root="$(pwd -P)"
          requirement_path="$(realpath -m -- "$REQUIREMENT_FILE")"
          if [[ "$requirement_path" != "$repo_root/"* ]]; then
            echo "Requirement file must be inside the target repository." >&2
            exit 1
          fi
          if [[ ! -f "$requirement_path" ]]; then
            echo "Requirement file not found: $REQUIREMENT_FILE" >&2
            exit 1
          fi

          filename="$(basename -- "$REQUIREMENT_FILE")"
          feature_name="${filename%.*}"
          common_args=(
            --requirement-name "$feature_name"
            --requirement-file "$requirement_path"
            --output-dir "$OUTPUT_DIRECTORY"
          )
          if [[ "${{ inputs.overwrite }}" == "true" ]]; then
            common_args+=(--overwrite)
          fi

          candidate_files=()

          run_with_model() {
            local spec="$1"
            shift
            local provider="${spec%%:*}"
            local model="${spec#*:}"
            if [[ -z "$provider" || -z "$model" || "$provider" == "$model" ]]; then
              echo "Invalid model selection '$spec'; expected provider:model." >&2
              return 1
            fi
            case "$provider" in
              openai)
                LLM_PROVIDER=openai_compatible LLM_API_URL=https://api.openai.com/v1/chat/completions \
                  LLM_API_KEY="$OPENAI_API_KEY" LLM_MODEL="$model" "$@"
                ;;
              gemini)
                LLM_PROVIDER=gemini LLM_API_URL=https://generativelanguage.googleapis.com/v1beta \
                  LLM_API_KEY="$GEMINI_API_KEY" LLM_MODEL="$model" "$@"
                ;;
              openrouter)
                LLM_PROVIDER=openai_compatible LLM_API_URL=https://openrouter.ai/api/v1/chat/completions \
                  LLM_API_KEY="$OPENROUTER_API_KEY" LLM_MODEL="$model" "$@"
                ;;
              *) echo "Unsupported provider '$provider'." >&2; return 1 ;;
            esac
          }

          candidate_specs=("$CANDIDATE_MODEL_1" "$CANDIDATE_MODEL_2" "$CANDIDATE_MODEL_3")
          for index in 0 1 2; do
            slot=$((index + 1))
            spec="${candidate_specs[$index]}"
            output_file="${feature_name}-candidate-${slot}.feature"
            echo "Checking candidate $slot: $spec"
            if ! check-llm-model --model "$spec" --timeout-seconds 20; then
              echo "WARNING: Candidate $slot is unavailable; skipping it." >&2
              continue
            fi
            if run_with_model "$spec" english-to-gherkin \
              "${common_args[@]}" --output-file "$output_file"; then
              candidate_files+=("$OUTPUT_DIRECTORY/$output_file")
            else
              echo "WARNING: Candidate $slot generation failed; continuing." >&2
            fi
          done

          if (( ${#candidate_files[@]} < 2 )); then
            echo "ERROR: At least two candidate providers must succeed; received ${#candidate_files[@]}." >&2
            exit 1
          fi

          reviewer_args=(
            --requirement-name "$feature_name"
            --requirement-file "$requirement_path"
            --output-dir "$OUTPUT_DIRECTORY"
            --output-file "${feature_name}.feature"
            --max-attempts 3
          )
          for candidate_file in "${candidate_files[@]}"; do
            reviewer_args+=(--candidate-file "$candidate_file")
          done
          if [[ "${{ inputs.overwrite }}" == "true" ]]; then
            reviewer_args+=(--overwrite)
          fi

          echo "Checking reviewer: $REVIEWER_MODEL_SPEC"
          check-llm-model --model "$REVIEWER_MODEL_SPEC" --timeout-seconds 20
          run_with_model "$REVIEWER_MODEL_SPEC" consolidate-gherkin "${reviewer_args[@]}"

      - name: Commit generated file
        id: commit
        working-directory: target
        env:
          CREATE_PR: ${{ inputs.create_pull_request }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "No changes were generated."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$CREATE_PR" == "true" ]]; then
            branch="ai-feature/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$branch"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi
          git add -- "${{ inputs.output_directory }}"
          git commit -m "Generate and consolidate features from ${{ inputs.requirement_file }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push generated change
        if: steps.commit.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          CREATE_PR: ${{ inputs.create_pull_request }}
          GENERATED_BRANCH: ${{ steps.commit.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          if [[ "$CREATE_PR" == "true" ]]; then
            git push --set-upstream origin "$GENERATED_BRANCH"
          else
            git push origin "HEAD:${{ steps.clone.outputs.base_branch }}"
          fi

      - name: Create pull request
        if: steps.commit.outputs.changed == 'true' && inputs.create_pull_request
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        shell: bash
        run: |
          gh pr create \
            --repo "${{ steps.target.outputs.repo }}" \
            --base "${{ steps.clone.outputs.base_branch }}" \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "Generate consolidated feature from ${{ inputs.requirement_file }}" \
            --body "Three independent candidates and one reviewer-consolidated master feature were generated by workflow run $GITHUB_RUN_ID. Use the unsuffixed feature as the test source and retain the candidates for traceability."
