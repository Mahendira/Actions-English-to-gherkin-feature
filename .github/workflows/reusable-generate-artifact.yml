name: Reusable artifact generation

on:
  workflow_call:
    inputs:
      artifact_type:
        required: true
        type: string
      branch_suffix:
        required: true
        type: string
      feature_file:
        required: true
        type: string
      stack:
        required: true
        type: string
      output_repo:
        required: false
        type: string
      base_branch:
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTROLLER_REPO: ${{ github.repository }}
      TARGET_INPUT: ${{ inputs.output_repo }}
    steps:
      - name: Check out generator
        uses: actions/checkout@v4
        with:
          path: generator

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: generator/pyproject.toml

      - name: Install generator
        run: pip install ./generator

      - name: Resolve target repository
        id: target
        shell: bash
        run: |
          set -euo pipefail
          raw="${TARGET_INPUT//[[:space:]]/}"
          if [[ -z "$raw" ]]; then
            repo="$CONTROLLER_REPO"
          else
            raw="${raw#https://github.com/}"
            raw="${raw#git@github.com:}"
            repo="${raw%.git}"
          fi
          if [[ ! "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid target repository. Use owner/repo or a GitHub URL." >&2
            exit 1
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "owner=${repo%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${repo#*/}" >> "$GITHUB_OUTPUT"

      - name: Create target GitHub App token
        id: app-token
        if: steps.target.outputs.repo != github.repository
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}

      - name: Clone target repository
        id: clone
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TARGET_REPO: ${{ steps.target.outputs.repo }}
          REQUESTED_BRANCH: ${{ inputs.base_branch }}
        shell: bash
        run: |
          set -euo pipefail
          branch="$REQUESTED_BRANCH"
          if [[ -z "$branch" ]]; then
            branch="$(gh repo view "$TARGET_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          fi
          gh repo clone "$TARGET_REPO" target -- --depth 1 --branch "$branch"
          echo "base_branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Generate reviewed artifact
        working-directory: target
        timeout-minutes: 20
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.LLM_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          REVIEWER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL || 'qwen/qwen3.8-27b:free' }}
          LLM_TIMEOUT_SECONDS: "120"
        shell: bash
        run: |
          set -euo pipefail
          feature_path="$(realpath -m -- "${{ inputs.feature_file }}")"
          repo_root="$(pwd -P)"
          if [[ "$feature_path" != "$repo_root/"* || ! -f "$feature_path" ]]; then
            echo "Feature file must exist inside the target repository: ${{ inputs.feature_file }}" >&2
            exit 1
          fi
          generate-project-artifact \
            --feature-file "$feature_path" \
            --artifact-type "${{ inputs.artifact_type }}" \
            --stack "${{ inputs.stack }}" \
            --repo-root "$repo_root" \
            --max-attempts 3

      - name: Commit generated artifact
        id: commit
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "No repository changes were generated." >&2
            exit 1
          fi
          branch="ai/${GITHUB_RUN_ID}-${{ inputs.branch_suffix }}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate ${{ inputs.artifact_type }} from ${{ inputs.feature_file }}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push branch and create pull request
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --set-upstream origin "${{ steps.commit.outputs.branch }}"
          gh pr create \
            --repo "${{ steps.target.outputs.repo }}" \
            --base "${{ steps.clone.outputs.base_branch }}" \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "Generate ${{ inputs.artifact_type }} (${{ inputs.stack }})" \
            --body "Generated independently by three models and consolidated by a fourth reviewer from `${{ inputs.feature_file }}`."
